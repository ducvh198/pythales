apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythales-hsm
  labels:
    app.kubernetes.io/name: pythales-hsm
    app.kubernetes.io/component: simulator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pythales-hsm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pythales-hsm
    spec:
      # Secret để pull image từ registry cá nhân registry.hevitech.io.vn
      imagePullSecrets:
        - name: hevitech-registry-secret
      containers:
        - name: pythales-hsm
          image: registry.hevitech.io.vn/pythales:latest
          imagePullPolicy: Always
          ports:
            - name: hsm-tcp
              containerPort: 1500
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pythales-config
            - secretRef:
                name: pythales-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Kiểm tra TCP socket port 1500 định kỳ
          livenessProbe:
            tcpSocket:
              port: 1500
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1500
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
