apiVersion: v1
kind: Service
metadata:
  name: pythales-hsm
  labels:
    app.kubernetes.io/name: pythales-hsm
    app.kubernetes.io/component: simulator
spec:
  # ClusterIP: Dành cho các pod nội bộ trong cluster (ví dụ ACS Kernel) kết nối qua pythales-hsm:1500
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pythales-hsm
  ports:
    - name: hsm-tcp
      port: 1500
      targetPort: 1500
      protocol: TCP
---
